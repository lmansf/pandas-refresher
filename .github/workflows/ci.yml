name: e2e

# Runs the Playwright end-to-end suite, which boots the real site headless
# (test/e2e.js starts its own static server over the repo root and drives the
# vendored Pyodide + pandas engine), so no separate web server is needed here.
on:
  pull_request:
  push:
    branches:
      - 'fm/**'
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install test dependencies
        working-directory: test
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: test
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: test
        run: npm test
